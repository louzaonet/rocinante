<style>/* Rocinante: papel cuadriculado y tinta de bolígrafo, como los mapas que se
   dibujaban para jugar a estas aventuras. */
:root {
  --paper: #eef2f5; --grid: #dbe3ea; --sheet: #ffffff; --ink: #1f3a68; --ink-soft: #3e5a8c;
  --pencil: #5d6875; --line: #c5d0db; --red: #c62f36; --red-soft: #fbe9ea; --amber: #8a5a00; --amber-soft: #fff4dc;
  --sel: #dfe8f6; --code-bg: #fbfcfd; --pick: #0e6e7a; --pick-soft: #dcf1f3;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  /* colores del código */
  --t-kw: #1f3a68; --t-loc: #2f7a3f; --t-obj: #9a4b00; --t-flag: #7b3fa0; --t-ref: #0e6e7a; --t-str: #8a1f2b; --t-com: #7a8591; --t-word: #3e5a8c; --t-unk: #c62f36;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131920; --grid: #1b232d; --sheet: #1a222c; --ink: #cfdcf2; --ink-soft: #9fb4d8; --pencil: #8c98a6;
    --line: #2c3845; --red: #ff6f72; --red-soft: #3a1f23; --amber: #ffc56b; --amber-soft: #33290f; --sel: #24324a; --code-bg: #161d26; --pick: #6fd6e2; --pick-soft: #163238;
    --t-kw: #9fc0ff; --t-loc: #7fd18f; --t-obj: #ffb36b; --t-flag: #d6a8ff; --t-ref: #6fd6e2; --t-str: #ff9aa5; --t-com: #6f7b89; --t-word: #b9cbec; --t-unk: #ff6f72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --paper: #131920; --grid: #1b232d; --sheet: #1a222c; --ink: #cfdcf2; --ink-soft: #9fb4d8; --pencil: #8c98a6;
    --line: #2c3845; --red: #ff6f72; --red-soft: #3a1f23; --amber: #ffc56b; --amber-soft: #33290f; --sel: #24324a; --code-bg: #161d26; --pick: #6fd6e2; --pick-soft: #163238;
    --t-kw: #9fc0ff; --t-loc: #7fd18f; --t-obj: #ffb36b; --t-flag: #d6a8ff; --t-ref: #6fd6e2; --t-str: #ff9aa5; --t-com: #6f7b89; --t-word: #b9cbec; --t-unk: #ff6f72;
    color-scheme: dark;
  }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--paper); color: var(--ink); font: 15px/1.45 var(--ui);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink-soft); }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 196px 1fr; grid-template-rows: auto 1fr auto; height: 100vh; }
.top { grid-column: 1 / -1; position: relative; display: flex; align-items: center; gap: 16px; padding: 8px 16px 16px; background: var(--sheet); }
/* las cuatro rayas del Spectrum bajo la cabecera */
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
  background: linear-gradient(#d70000 0 2px, #d7d700 2px 4px, #00d700 4px 6px, #00d7d7 6px 8px); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { display: block; width: 44px; height: 44px; flex: none; }
.brand-mark svg { display: block; width: 100%; height: 100%; }
.brand-name { font: 700 22px/1 var(--serif); letter-spacing: .01em; }
.brand-game { color: var(--pencil); font-style: italic; font-family: var(--serif); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menus { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; list-style: none; margin: 0; padding: 4px 0; min-width: 260px; background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 4px; box-shadow: 4px 4px 0 var(--grid); }
.menu-list li { padding: 7px 14px; cursor: pointer; }
.menu-list li:hover, .menu-list li:focus { background: var(--sel); outline: none; }
.menu-list li.group { font-weight: 600; }
.menu-list li .caret { display: inline-block; width: 1.1em; }
.menu-list li.sub { padding-left: 32px; }
.menu-list li.heading { padding: 6px 14px 2px 32px; cursor: default; font-size: 12px; letter-spacing: .06em; opacity: .7; }
.menu-list li.heading:hover, .menu-list li.sep:hover { background: none; }
.menu-list li.sep { padding: 0; margin: 4px 14px 4px 32px; border-top: 1px solid var(--grid); cursor: default; }

.btn { border: 1.5px solid var(--ink); background: var(--sheet); border-radius: 3px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--sel); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { border-color: var(--line); }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn.primary:hover, .btn.primary.on { background: var(--ink-soft); }
.btn.small { padding: 3px 9px; font-size: 13.5px; }

.side { background: var(--sheet); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: auto; }
.side nav { display: flex; flex-direction: column; padding: 10px 0; }
.side nav a { display: flex; justify-content: space-between; align-items: center; padding: 7px 18px; text-decoration: none; color: var(--ink); border-left: 3px solid transparent; }
.side nav a:hover { background: var(--sel); }
.side nav a.sel { border-left-color: var(--red); background: var(--sel); font-weight: 600; }
.side-foot { margin-top: auto; padding: 12px 16px; color: var(--pencil); font-size: 12.5px; }
.side-foot a { color: inherit; white-space: nowrap; }
.badge { background: var(--red); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11.5px; margin-left: 6px; font-weight: 600; }

.main { overflow: auto; min-height: 0; }
.page { padding: 20px 24px 40px; max-width: 1000px; }
.split { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; height: 100%; min-height: 0; }
.detail { padding: 18px 24px 40px; overflow: auto; }
.detail.empty-state { color: var(--pencil); max-width: 60ch; }
.detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.spacer { flex: 1; }
.num { font: 12px var(--mono); color: var(--pencil); min-width: 2.2em; display: inline-block; }
.num.big { font-size: 20px; color: var(--ink); min-width: 0; }
.note { color: var(--pencil); font-size: 13.5px; }
.muted { color: var(--pencil); }

.itemlist { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--sheet) 85%, transparent); }
.itemlist-top { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
.itemlist-top input { flex: 1; min-width: 0; }
.itemlist ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
.itemlist li { padding: 7px 12px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; column-gap: 6px; border-bottom: 1px dashed var(--grid); }
.itemlist li b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.itemlist li small { grid-column: 2; color: var(--pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.itemlist li:hover { background: var(--sel); }
.itemlist li.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--red); }
.itemlist li.empty { color: var(--pencil); cursor: default; }

input[type=text], input:not([type]), input[type=search], input[type=number], select, textarea {
  border: 1px solid var(--line); background: var(--sheet); border-radius: 3px; padding: 5px 8px;
}
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 2px var(--sel); }
textarea { width: 100%; resize: vertical; font-family: var(--serif); font-size: 16px; line-height: 1.5; }
input[type=number] { width: 6em; }
.field { display: flex; flex-direction: column; gap: 4px; margin: 0 0 16px; }
.field.wide { width: 100%; }
.field-label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.field-hint { font-size: 12.5px; color: var(--pencil); max-width: 70ch; }
.field-error { color: var(--red); font-size: 12.5px; display: block; }
.lazy { display: inline-flex; flex-direction: column; }
.id-input input { font: 600 18px var(--mono); width: 18em; max-width: 100%; }
.id-input.small input { font-size: 14px; width: 12em; }
.row { display: flex; gap: 18px; align-items: center; margin-bottom: 10px; }
.row.wrap { flex-wrap: wrap; align-items: flex-start; }
.checks label, label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.attrs { display: grid; grid-template-columns: repeat(8, auto); gap: 6px 14px; padding: 8px 0; }
details summary { cursor: pointer; color: var(--ink-soft); font-weight: 600; font-size: 13px; }
h2, h3 { font-family: var(--serif); font-weight: 700; }
h3 { margin: 28px 0 6px; font-size: 20px; }
.title-edit input { font: 700 32px/1.1 var(--serif); border: 0; border-bottom: 1.5px dashed var(--line); background: transparent; width: 100%; padding: 4px 0; }

table.grid { border-collapse: collapse; margin: 6px 0 10px; }
table.grid td, table.grid th { padding: 4px 8px 4px 0; text-align: left; vertical-align: top; }
table.grid th { font-size: 12.5px; color: var(--pencil); font-weight: 600; }
table.grid.vocab td input:not([type]) { width: 9em; font-family: var(--mono); }
table.grid.sys td:nth-child(2) { width: 15em; font-size: 13px; padding-top: 8px; }
table.grid.sys td:nth-child(3) { width: 100%; }
table.grid.sys textarea { font-size: 15px; }
table.grid.tight td { padding: 1px 8px 1px 0; font-size: 13px; }
.msglist { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.msg { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
.msg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.warn-box { background: var(--amber-soft); color: var(--amber); border: 1px solid currentColor; padding: 10px 14px; border-radius: 4px; max-width: 70ch; }

/* mapa */
.mapwrap { padding: 16px 20px; }
svg.map { background: transparent; }
.map-line { stroke: var(--ink-soft); stroke-width: 1.6; }
.map-line.oneway { stroke-dasharray: 5 4; }
.map-arrow { fill: var(--ink-soft); }
.map-room rect { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.5; }
.map-room { cursor: pointer; }
.map-room:hover rect { fill: var(--sel); }
.map-room.sel rect { stroke: var(--red); stroke-width: 2.5; }
.map-room.intro rect { stroke-dasharray: 4 3; }
.map-id { font: 600 12.5px var(--mono); fill: var(--ink); }
.map-num { font: 11px var(--ui); fill: var(--pencil); }

/* procesos */
.procs { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.proc-tabs { display: flex; gap: 2px; padding: 8px 12px 0; flex-wrap: wrap; align-items: flex-end; border-bottom: 1.5px solid var(--ink); background: var(--sheet); }
.proc-tab { border: 1px solid var(--line); border-bottom: 0; background: var(--paper); padding: 5px 12px; border-radius: 4px 4px 0 0; cursor: pointer; font-family: var(--mono); font-size: 13px; }
.proc-tab.sel { background: var(--code-bg); border-color: var(--ink); border-width: 1.5px; margin-bottom: -1.5px; padding-bottom: 6.5px; font-weight: 600; }
.proc-tabs .btn { margin: 0 0 4px 8px; }
.proc-head { display: flex; align-items: center; gap: 12px; padding: 8px 14px; flex-wrap: wrap; }
.proc-body { flex: 1; display: grid; grid-template-columns: 1fr auto; min-height: 0; }
.code { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; min-height: 0; background: var(--code-bg); border-top: 1px solid var(--line); }
.gutter { overflow: hidden; padding: 10px 6px 10px 10px; text-align: right; color: var(--pencil); font: 13px/20px var(--mono); user-select: none; border-right: 1px solid var(--line); }
.gutter .err { color: var(--red); font-weight: 700; }
.code-area { position: relative; min-height: 0; }
.code-area pre, .code-area textarea { position: absolute; inset: 0; margin: 0; padding: 10px 14px; font: 14px/20px var(--mono); white-space: pre; overflow: auto; tab-size: 4; border: 0; }
.code-area pre { pointer-events: none; color: var(--ink); }
.code-area textarea { color: transparent; background: transparent; caret-color: var(--ink); resize: none; border-radius: 0; box-shadow: none; }
.code-area textarea::selection { background: color-mix(in srgb, var(--ink) 25%, transparent); }
.cl { min-height: 20px; }
.cl.err { background: var(--red-soft); text-decoration: underline wavy var(--red); text-underline-offset: 4px; text-decoration-skip-ink: none; }
.t-kw { color: var(--t-kw); font-weight: 700; } .t-hdr { color: var(--red); font-weight: 700; }
.t-loc { color: var(--t-loc); } .t-obj { color: var(--t-obj); } .t-flag { color: var(--t-flag); } .t-ref { color: var(--t-ref); }
.t-str { color: var(--t-str); } .t-com { color: var(--t-com); font-style: italic; } .t-word { color: var(--t-word); }
.t-n, .t-const, .t-label { color: var(--ink-soft); } .t-unk { color: var(--t-unk); }
.code-errors { grid-column: 1 / -1; margin: 0; padding: 6px 14px; list-style: none; border-top: 1px solid var(--red); background: var(--red-soft); color: var(--red); font-size: 13px; max-height: 120px; overflow: auto; }
.code-errors li { cursor: pointer; }
.help { width: 300px; overflow: auto; padding: 10px 12px 30px; border-left: 1px solid var(--line); background: var(--sheet); font-size: 13px; }
.help input { width: 100%; }
.help h4 { margin: 14px 0 4px; font-family: var(--serif); font-size: 15px; }
.help dl { margin: 0; }
.help .cd { padding: 4px 6px; border-radius: 3px; cursor: pointer; }
.help .cd:hover { background: var(--sel); }
.help dt { font: 600 12.5px var(--mono); }
.help .args { font-weight: 400; color: var(--pencil); font-family: var(--ui); }
.help dd { margin: 0; color: var(--pencil); }

/* probar */
.play { display: grid; grid-template-columns: 1fr 300px; height: 100%; min-height: 0; }
.play-main { padding: 14px 20px; overflow: auto; }
.play-bar { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
.game-host { max-width: 820px; }
.debug { border-left: 1px solid var(--line); background: var(--sheet); padding: 6px 14px 30px; overflow: auto; font-size: 13.5px; }
.debug h3 { font-size: 17px; margin: 14px 0 6px; }
.debug h4 { margin: 10px 0 4px; font-size: 13px; color: var(--ink-soft); }
.debug ul { margin: 0; padding-left: 18px; }
.debug textarea { font-family: var(--mono); font-size: 13px; }

/* dibujos */
.pic .paint { margin-bottom: 18px; }
.paint-tools { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 8px; }
.tool { border: 1px solid var(--line); background: var(--sheet); padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 13.5px; }
.tool.sel { border-color: var(--ink); background: var(--sel); font-weight: 600; }
.paint-tools .sep { width: 10px; }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
.swatches input[type=color] { width: 40px; height: 28px; padding: 0; border: 1px solid var(--line); }
.sw { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 2px; cursor: pointer; padding: 0; }
.sw.sel { outline: 2px solid var(--red); outline-offset: 1px; }
.paint-area { position: relative; max-width: 900px; border: 1.5px solid var(--ink); }
.paint-area canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.paint-area .paint-preview { pointer-events: none; }
.zx-preview { display: grid; grid-template-columns: minmax(0, 520px) 1fr; gap: 24px; }
.zx-preview > div:first-child { display: flex; flex-direction: column; gap: 6px; }
.zx-pic { width: 100%; image-rendering: pixelated; border: 1.5px solid var(--ink); }
.zx-opts { display: flex; flex-direction: column; gap: 10px; }
/* dibujos vectoriales */
.vec-toolopts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 34px; margin-bottom: 8px; }
.vec-body { display: grid; grid-template-columns: minmax(0, 768px) minmax(220px, 300px); gap: 18px; align-items: start; }
.vec-screen { position: relative; border: 1.5px solid var(--ink); background: #000; }
.vec-screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.vec-overlay { cursor: crosshair; touch-action: none; image-rendering: auto; }
.vec-overlay.pick { cursor: default; }
.vec-overlay.grab { cursor: move; }
.vec-overlay:focus-visible { outline: 2px solid #4dc8ff; outline-offset: 2px; }
.vec-selbar { display: inline-flex; gap: 4px; flex-wrap: wrap; padding-right: 8px; border-right: 1px solid var(--line); }
.vec-msg { background: var(--pick-soft); border-left: 3px solid var(--pick); padding: 6px 10px; margin: 10px 0; max-width: 768px; }
.vec-pos { position: absolute; left: 6px; bottom: 4px; font: 12px var(--mono); color: #fff; background: rgba(0,0,0,.55); padding: 1px 6px; border-radius: 2px; pointer-events: none; }
.vec-side { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.vec-list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.vec-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); background: var(--sheet); max-height: 420px; overflow: auto; font: 13px/1.35 var(--mono); counter-reset: op; }
.vec-list li { padding: 3px 8px; cursor: pointer; border-bottom: 1px solid var(--grid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vec-list li:not(.vec-start)::before { counter-increment: op; content: counter(op) ". "; color: var(--pencil); }
.vec-list li.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--ink); }
.vec-list li.warn { color: var(--red); background: var(--red-soft); }
.vec-list li.insel { background: var(--pick-soft); color: var(--pick); }
.vec-list li.insel.sel { box-shadow: inset 3px 0 0 var(--pick); }
.vec-list .vec-start { color: var(--pencil); font-style: italic; }
.vec-list-tools { display: flex; gap: 6px; flex-wrap: wrap; }
.vec-warn { color: var(--red); background: var(--red-soft); border-left: 3px solid var(--red); padding: 6px 10px; margin: 10px 0; max-width: 768px; }
.vec-extra { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
.vec-colours { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.vec-colours .field-label { min-width: 11em; }
.sw-text { width: auto; min-width: 22px; height: 22px; font: 12px var(--mono); background: var(--sheet); color: var(--ink); }
.vec-letter { width: 3em; text-align: center; }
.vec-patterns { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.vec-pat { padding: 2px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; line-height: 0; }
.vec-pat.sel { border-color: var(--ink); box-shadow: 0 0 0 1.5px var(--ink); }
.vec-pat canvas { width: 24px; height: 24px; image-rendering: pixelated; }
.vec-opts { max-width: 520px; }
.vec-pair { display: flex; gap: 6px; }

/* problemas */
.problems { grid-column: 1 / -1; display: flex; gap: 14px; align-items: flex-start; padding: 6px 16px; background: var(--sheet); border-top: 1.5px solid var(--ink); font-size: 13.5px; max-height: 130px; overflow: auto; color: var(--pencil); }
.problems.bad { color: var(--red); }
.problems .count { font-weight: 700; white-space: nowrap; }
.problems ul { list-style: none; margin: 0; padding: 0; }
.problems li { cursor: pointer; }
.problems li.w { color: var(--amber); }
.problems li:hover { text-decoration: underline; }
.toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 10px 18px; border-radius: 4px; max-width: min(90vw, 640px); z-index: 50; box-shadow: 4px 4px 0 var(--grid); }
.loading { padding: 40px; font-family: var(--serif); font-size: 20px; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .side nav { flex-direction: row; overflow-x: auto; padding: 0; }
  .side nav a { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 8px 12px; }
  .side nav a.sel { border-bottom-color: var(--red); }
  .side-foot { display: none; }
  .top { flex-wrap: wrap; gap: 6px 12px; }
  .menus { margin-left: 0; width: 100%; }
  .menus .btn { padding: 4px 8px; }
  .split, .play, .proc-body, .zx-preview, .vec-body { grid-template-columns: 1fr; }
  .itemlist { max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .help, .debug { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  .code { min-height: 60vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.dialog-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--paper) 60%, transparent); display: grid; place-items: center; z-index: 60; padding: 16px; }
.dialog { background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 4px; box-shadow: 6px 6px 0 var(--grid); padding: 18px 20px; max-width: 440px; }
.dialog p { margin: 0 0 14px; font-family: var(--serif); font-size: 17px; }

.guide { max-width: 68ch; }
.guide p { margin: 0 0 10px; }
.guide pre { font: 13.5px/1.5 var(--mono); background: var(--code-bg); border: 1px solid var(--line); border-radius: 3px; padding: 10px 14px; overflow-x: auto; }

/* Pantalla del Spectrum: compartida por el editor y las partidas publicadas */
.zx-frame { padding: 6%; padding-top: 5%; padding-bottom: 5%; border-radius: 4px; transition: background-color .2s; max-width: 100%; box-sizing: border-box; }
.zx-screen { position: relative; aspect-ratio: 4 / 3; width: 100%; cursor: text; }
.zx-canvas, .zx-overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.zx-canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.zx-overlay { pointer-events: none; }
.zx-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; font-size: 16px; color: transparent; background: transparent; caret-color: transparent; }
.zx-screen:focus-within { outline: 2px solid #5b8def; outline-offset: 4px; }
</style>
</head>

> _ _
    PROCESS cada_turno
> _ _
    PARSE 0                ; si no se entiende la frase...
    PROCESS no_entiendo
    REDO
> _ _
    EQ fTurns 255
    PLUS fTurnsHi 1
    CLEAR fTurns
    SKIP 1
> _ _
    PLUS fTurns 1
> _ _
    PROCESS respuestas
    ISDONE                 ; si alguna respuesta hizo algo, otra orden
    REDO
> _ _
    MOVE fPlayer           ; si no, a ver si es un movimiento
    RESTART
> _ _
    NEWTEXT
    LT fVerb 14
    SYSMESS 7
    REDO
> _ _
    SYSMESS 8
    REDO
`,mc=`; La frase no se entiende (o se acab\xF3 el tiempo de espera).
> _ _
    HASAT TIMEOUT
    SYSMESS 35
    DONE
> _ _
    SYSMESS 6
`,yc=`; Despu\xE9s de describir la localidad: los objetos que hay.
> _ _
    NEWLINE
    ZERO fDarkF
    LISTOBJ
`,Hc=`; Se ejecuta antes de cada orden: aqu\xED van los sucesos que pasan solos.
`,Nc=`; Respuestas a las \xF3rdenes del jugador. Las m\xE1s concretas, primero.
> I _
    SYSMESS 9
    LISTAT CARRIED
    SYSMESS 10
    LISTAT WORN
    DONE
> COGER TODO
    DOALL HERE
> COGER _
    AUTOG
    DONE
> DEJAR TODO
    DOALL CARRIED
> DEJAR _
    AUTOD
    DONE
> QUITA TODO
    DOALL WORN
> QUITA _
    AUTOR
    DONE
> PONER TODO
    DOALL CARRIED
> PONER _
    AUTOW
    DONE
> MIRAR _
    RESTART
> EXAMI _
    MESSAGE "No veo nada especial."
    DONE
> PUNTO _
    MES "Llevas "
    PRINT fScore
    MESSAGE " puntos."
    DONE
> TURNO _
    MES "Has dado "
    DPRINT fTurns
    MESSAGE " \xF3rdenes."
    DONE
> FIN _
    QUIT
    END
> FIN _
    DONE
> GRABA _
    SAVE 0
    RESTART
> CARGA _
    LOAD 0
    RESTART
> RAMSA _
    RAMSAVE
    MESSAGE "Partida guardada en memoria."
    DONE
> RAMLO _
    RAMLOAD 255
    RESTART
`,Mc=`; Inicio de la partida: ventanas, presentaci\xF3n y estado inicial.
> _ _
    WINDOW 1
    WINAT 12 0             ; el texto, de la l\xEDnea 12 hacia abajo
    WINSIZE 12 42
    CLS
    DESC intro             ; la presentaci\xF3n
    ANYKEY
    CLS
    SET 255
> _ _
    MINUS 255 1            ; borra todas las banderas menos la 29
    NOTEQ 255 fGFlags
    CLEAR @255
> _ _
    NOTZERO 255
    SKIP -2
> _ _
    RESET                  ; objetos a su sitio inicial
    LET fStrength 10
    LET fMaxCarr 4
    SET fCPronounNoun
    SET fCPronounAdject
    GOTO entrada           ; primera localidad del juego
