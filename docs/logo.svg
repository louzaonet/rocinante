<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rocinante">
  <!-- Rocinante: la cabeza del caballo en líneas rectas, como un dibujo vectorial de
       DAAD, con la crin en los cuatro colores del Spectrum y una pluma de escribir.
       Parte de Rocinante (ver LICENSE). -->
  <defs><clipPath id="rocinante-tile"><rect width="64" height="64" rx="7"/></clipPath></defs>
  <g clip-path="url(#rocinante-tile)">
    <rect width="64" height="64" fill="#000"/>
    <g transform="translate(5 0)">
      <!-- crin: las cuatro franjas -->
      <g transform="translate(45.5 16) rotate(-16)">
        <rect x="0" y="0" width="3.6" height="60" fill="#d70000"/>
        <rect x="3.6" y="0" width="3.6" height="60" fill="#d7d700"/>
        <rect x="7.2" y="0" width="3.6" height="60" fill="#00d700"/>
        <rect x="10.8" y="0" width="3.6" height="60" fill="#00d7d7"/>
      </g>
      <!-- cabeza de Rocinante, en líneas rectas como un dibujo de DAAD -->
      <path d="M15 40 L13 46 L16 51 L23 52 L29 47 L35 46 L39 50 L42 64 L58 64 L51 38 L45.5 16 L43 4 L38 14 L32 17 L22 28 Z" fill="#d7d7d7"/>
      <!-- pómulo (o brida), ojo y ollar -->
      <path d="M33 30 L38 43 L35 46" fill="none" stroke="#000" stroke-width="1.6"/>
      <rect x="30" y="24" width="3" height="3" fill="#000"/>
      <rect x="16" y="44" width="3" height="2" fill="#000"/>
    </g>
    <!-- pluma -->
    <g transform="translate(6.5 61) rotate(-73)">
      <path d="M0 0 L10 0" stroke="#fff" stroke-width="1.4"/>
      <path d="M10 0 C 20 -4.4, 36 -4.4, 50 -0.8 L 51 0 L 50 0.8 C 36 4.4, 20 4.4, 10 0 Z" fill="#fff"/>
      <path d="M24 -3.5 L28.5 -1 L29 -3.8 Z M34 3.3 L37.5 0.9 L38.5 3.5 Z" fill="#000"/>
      <path d="M10 0 L49 0" stroke="#000" stroke-width="0.7"/>
      <path d="M-3 0 L0 -0.9 L0 0.9 Z" fill="#fff"/>
    </g>
  </g>
</svg>
